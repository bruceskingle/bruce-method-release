[package]
name = "bruce-method-release"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Developing and releasing a set of Rust repositories which depend on one another, one way, in the right order"
repository = "https://github.com/bruceskingle/bruce-method-release"
readme = "README.md"
keywords = ["release", "publish", "git", "workflow", "crates-io"]
categories = ["development-tools", "command-line-utilities"]
# Only for working on the crate, not for building it.
exclude = [".github", "AGENTS.md", "docs/Release.md"]

[package.metadata.bruce-method]
kind = "crate"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Reading the output of cargo metadata and gh.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Changing Cargo.toml and .cargo/config.toml, keeping their layout and comments.
toml_edit = "0.25.19"
